[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcelens-backend"
version = "0.1.0"
description = "FastAPI backend for SourceLens"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn>=0.32,<1.0",
    "pypdf>=6.0,<7.0",
    "tiktoken>=0.12,<1.0",
    "azure-identity>=1.25,<2.0",
    "azure-storage-blob>=12.27,<13.0",
    "python-multipart>=0.0.20,<1.0",
    "openai>=2.0,<3.0",
    "azure-search-documents>=11.6,<12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "httpx>=0.27,<0.29",
    "reportlab>=4.4,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
